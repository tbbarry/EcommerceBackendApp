spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5435/${POSTGRES_DB}
    #url: jdbc:postgresql://postgres:5432/${POSTGRES_DB} lors de la connexion à la base de données depuis le conteneur de l'application
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    
server:
  port: ${SERVER_PORT:8080}