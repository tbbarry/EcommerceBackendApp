spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5435/${POSTGRES_DB}
    #url: jdbc:postgresql://postgres:5432/${POSTGRES_DB} lors de la connexion à la base de données depuis le conteneur de l'application
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  sql:
    init:
      mode: never
      data-locations: classpath:data.sql

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  mail:
      host: localhost
      port: 1025
      username: ""
      password: ""
      properties:
        mail:
          smtp:
            auth: false
            starttls:
              enable: false
            connectiontimeout: 5000
            timeout: 5000
            writetimeout: 5000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT}

app:
  url: http://localhost:${SERVER_PORT}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:${APP_FRONTEND_PORT}}
  frontend_app: ${FRONTEND_APP}
  stock:
    reservation-timeout-minutes: 15
  scheduler:
    stock-release-cron: 0 */5 * * * *
    enabled: true
  name: EcommerceApp
  tax:
    rate: 0.20
  upload:
    dir: uploads/products
    base-url: /api/images

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS}

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
currency:
  code: usd
  symbol: $ 

