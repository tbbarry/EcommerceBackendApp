name: Build WORKFLOW

on:
  push:
    branches:
      - main
      - develop
      - FEAT/creation-classes

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPOSITORY: ecommerce-appimage
  REGISTRY: ghcr.io

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Maven Build
        run: mvn install

      - name: Upload Build Artifacts WAR
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-app
          path: target/*.war

      - name: Notify if Build Fails
        if: failure()
        run: echo "Build failed! Please check the logs for details."

  Testing:
    runs-on: ubuntu-latest
    needs: Build

    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run tests on main branches
        if: github.ref == 'refs/heads/main'
        run: mvn test

      - name: Checkstyle
        if: github.ref == 'refs/heads/main'
        run: mvn checkstyle:checkstyle

      - name: Run tests on other branches
        if: github.ref != 'refs/heads/main'
        run: echo "Skipping unit tests and code analysis."

  Security_Scan:
    runs-on: ubuntu-latest
    needs: Build

    container:
      image: aquasec/trivy:0.28.0
      options: --entrypoint ""

    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy filesystem scan
        run: |
          trivy fs \
          --format json \
          --exit-code 0 \
          --vuln-type os,library \
          --output trivy-results.json \
          .

      - name: Upload Trivy scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.json

  BUILD_AND_PUBLISH:
    name: BUILD_AND_PUBLISH_TO_GHCR
    runs-on: ubuntu-latest
    environment: production
    needs:
      - Build
      - Testing
      - Security_Scan

    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image name
        run: |
          echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_REPOSITORY}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u "${{ github.actor }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfiles/app/Dockerfile \
            -t $IMAGE_NAME:$IMAGE_TAG \
            -t $IMAGE_NAME:latest \
            .

      - name: Push Docker image to GitHub Container Registry
        run: |
          docker push $IMAGE_NAME:$IMAGE_TAG
          docker push $IMAGE_NAME:latest